version: 2

project_name: dctx

before:
  hooks:
    - go mod tidy

builds:
  - id: dctx
    main: ./main.go
    binary: dctx
    ldflags:
      - -s -w -X github.com/emersonkopp/dev-context-cli/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: dctx
    # Name macOS assets "macos" (not goreleaser's default "darwin"): the
    # self-update matcher in dctx <= 1.3.0 only recognizes the "macos" spelling,
    # so publishing "macos" keeps auto-update working for ALL past versions.
    # dctx >= 1.3.1 accepts both spellings. Guarded by a test in internal/update.
    name_template: "dctx_{{ .Version }}_{{ if eq .Os \"darwin\" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "dctx_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: emersonkopp
    name: dev-context-cli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
